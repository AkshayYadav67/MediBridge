services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medibridge
      POSTGRES_USER: medibridge
      POSTGRES_PASSWORD: medibridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibridge"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Daily reminders (appointment + refill alerts)
  scheduler:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: sh -c "while true; do python manage.py send_reminders; sleep 3600; done"
    depends_on:
      - web

volumes:
  pgdata:
  media:
